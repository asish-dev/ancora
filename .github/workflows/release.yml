name: Release

on:
  push:
    branches: [main]

# Changesets opens/updates a "Version Packages" PR as changesets accumulate;
# merging that PR publishes to npm. Requires an NPM_TOKEN secret with publish
# rights to the @ancora scope. Until that secret exists, this workflow no-ops
# safely (publish step is gated).
concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: build + typecheck + test (gate before any publish)
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
